name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - run: bun run compile

      - run: bun run build
      - run: bun run build:firefox

      - run: bun run zip
      - run: bun run zip:firefox

      - name: List zip outputs
        run: ls -la .output/ && ls -la .output/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: extension-zips
          path: .output/*.zip
          retention-days: 14
