name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - run: bun run compile

      - run: bun run build
      - run: bun run build:firefox

      - run: bun run zip
      - run: bun run zip:firefox

      - uses: actions/upload-artifact@v4
        with:
          name: extension-zips
          # .output/ is a dot-directory, excluded as "hidden" unless opted in
          include-hidden-files: true
          path: .output/*.zip
          retention-days: 14

  guardrails:
    # Non-blocking for one cycle (continue-on-error): flip to enforced
    # once the checks prove stable. Covers Batch 6 hallway tests.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - run: bun run test

      - run: bun run check-patterns
